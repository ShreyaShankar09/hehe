<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5ef">
    <title>A Fresh Start</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #24352e;
            --muted: #64736a;
            --paper: #f3f5ef;
            --green: #466b53;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        a {
            color: inherit;
        }

        .topbar {
            width: min(1120px, calc(100% - 48px));
            height: 76px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .wordmark {
            font-family: "Trebuchet MS", sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 28px;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 13px;
        }

        nav a {
            text-decoration: none;
        }

        nav a:hover,
        .text-link:hover {
            color: var(--green);
        }

        main {
            width: min(1120px, calc(100% - 48px));
            margin: 0 auto;
        }

        .hero {
            min-height: min(690px, calc(100svh - 76px));
            display: grid;
            align-content: center;
            justify-items: center;
            padding: 48px 0 72px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 17px;
            color: var(--green);
            font-family: "Trebuchet MS", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 760px;
            margin: 0;
            font-size: clamp(48px, 8vw, 88px);
            font-weight: 400;
            line-height: 0.98;
        }

        .intro {
            max-width: 470px;
            margin: 22px 0 28px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .button {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 0 21px;
            border: 1px solid var(--green);
            background: var(--green);
            color: white;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 13px;
            text-decoration: none;
            transition: background 160ms ease, color 160ms ease;
        }

        .button:hover {
            background: transparent;
            color: var(--green);
        }

        .hero-image {
            width: min(100%, 900px);
            height: clamp(190px, 29vw, 310px);
            margin-top: 54px;
            object-fit: cover;
            object-position: center 54%;
        }

        .note {
            padding: 54px 0 70px;
            border-top: 1px solid #d9dfd6;
            text-align: center;
        }

        .note h2 {
            margin: 0 0 12px;
            font-size: 30px;
            font-weight: 400;
        }

        .note p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .text-link {
            text-underline-offset: 4px;
        }

        @media (max-width: 560px) {
            .topbar,
            main {
                width: calc(100% - 36px);
            }

            .topbar {
                height: 66px;
            }

            nav {
                gap: 16px;
                font-size: 12px;
            }

            .hero {
                min-height: auto;
                padding: 72px 0 56px;
            }

            .intro {
                font-size: 16px;
            }

            .hero-image {
                margin-top: 42px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="wordmark" href="#home">A FRESH START</a>
        <nav aria-label="Main navigation">
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main id="home">
        <section class="hero" aria-labelledby="page-title">
            <p class="eyebrow">A little corner of the internet</p>
            <h1 id="page-title">Make room<br>for good things.</h1>
            <p class="intro">A simple space for fresh ideas, small moments, and whatever comes next.</p>
            <a class="button" href="#about">Take a look</a>
            <img class="hero-image" src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&amp;fit=crop&amp;w=1800&amp;q=85" alt="Sunlight falling across green leaves">
        </section>
        <section class="note" id="about" aria-labelledby="about-title">
            <h2 id="about-title">Start wherever you are.</h2>
            <p>There is always room for something new. <a class="text-link" id="contact" href="mailto:hello@example.com">Say hello</a>.</p>
        </section>
    </main>
</body>
</html>
